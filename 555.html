    // --- PWA Icon Generator, Dynamic Manifest & Service Worker Setup ---
    function generatePwaIconDataUrl(size) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return '';

        // Deep hub gradient background with rounded corners
        const r = Math.round(size * 0.22);
        ctx.beginPath();
        ctx.roundRect(0, 0, size, size, r);
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#3a75be');
        grad.addColorStop(0.55, '#1f3e6c');
        grad.addColorStop(1, '#14223b');
        ctx.fillStyle = grad;
        ctx.fill();

        // Subtle inner highlight ring
        ctx.lineWidth = Math.max(2, Math.round(size * 0.02));
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.stroke();

        // Compass / Navigation diamond emblem
        const cx = size * 0.5;
        const cy = size * 0.44;
        const rad = size * 0.23;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, rad, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fill();
        ctx.lineWidth = Math.max(2, Math.round(size * 0.018));
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.stroke();

        // North pointer (emerald accent)
        ctx.beginPath();
        ctx.moveTo(0, -rad * 0.72);
        ctx.lineTo(rad * 0.24, 0);
        ctx.lineTo(-rad * 0.24, 0);
        ctx.closePath();
        ctx.fillStyle = '#34d399';
        ctx.fill();

        // South pointer (warm amber/white)
        ctx.beginPath();
        ctx.moveTo(0, rad * 0.72);
        ctx.lineTo(rad * 0.24, 0);
        ctx.lineTo(-rad * 0.24, 0);
        ctx.closePath();
        ctx.fillStyle = '#f8fafc';
        ctx.fill();

        // Center pivot dot
        ctx.beginPath();
        ctx.arc(0, 0, rad * 0.11, 0, Math.PI * 2);
        ctx.fillStyle = '#14223b';
        ctx.fill();
        ctx.restore();

        // Short Lao badge label near bottom of icon
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.max(12, Math.round(size * 0.13))}px "Noto Sans Lao", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ເມນູ', cx, size * 0.81);

        return canvas.toDataURL('image/png');
      } catch (err) {
        console.warn('PWA icon canvas generation failed:', err);
        return '';
      }
    }

        const manifestBlob = new Blob([JSON.stringify(manifestObj, null, 2)], {

    function registerDynamicServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      // Service workers require secure context (https or localhost) and same-origin script
      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        return;
      }

      try {
        const swCode = `
          const CACHE_NAME = 'lao-nav-menu-hub-v1';
          self.addEventListener('install', (event) => {
            self.skipWaiting();
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => {
                return cache.addAll([self.registration.scope]).catch(() => {});
              })
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys().then((keys) =>
                Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))
              ).then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;
            event.respondWith(
              fetch(event.request)
                .then((response) => {
                  if (response && response.status === 200 && response.type === 'basic') {
                    const copy = response.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, copy)).catch(() => {});
                  }
                  return response;
                })
                .catch(() => caches.match(event.request).then((cached) => cached || caches.match(self.registration.scope)))
            );
          });
        `;

        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);

        navigator.serviceWorker
          .register(swUrl, { scope: './' })
          .then(() => {
            state.swRegistered = true;
          })
          .catch(() => {
            // Blob SW registration can be blocked in certain sandboxed/preview frames; manual shortcut guide remains available
            state.swRegistered = false;
          });
      } catch (_) {
        state.swRegistered = false;
      }
    }

    function detectStandaloneMode() {
      const displayStandalone =
        window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
      const iosStandalone = Boolean(window.navigator.standalone);
      const isStandalone = Boolean(displayStandalone || iosStandalone);
      state.isStandaloneApp = isStandalone;
      document.body.classList.toggle('pwa-standalone', isStandalone);
      return isStandalone;
    }

    function detectDevicePlatform() {
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(ua);
      const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|Edg|OPR|Android/i.test(ua);
      const isEdge = /Edg/i.test(ua);
      const isChrome = /Chrome|CriOS/i.test(ua) && !isEdge;
      return { isIOS, isAndroid, isSafari, isEdge, isChrome };
    }

    async function triggerNativeInstallPrompt() {
      const promptEvent = state.deferredInstallPrompt;
      if (!promptEvent) {
        openInstallGuideModal();
        return;
      }

      try {
        promptEvent.prompt();
        const choice = await promptEvent.userChoice;
        state.deferredInstallPrompt = null;
        if (choice && choice.outcome === 'accepted') {
          state.installOutcome = 'accepted';
          showToast('ກຳລັງຕິດຕັ້ງແອັບ "ເມນູນຳທາງ" ໃສ່ອຸປະກອນຂອງທ່ານ...');
        } else {
          state.installOutcome = 'dismissed';
          showToast('ຍົກເລີກການຕິດຕັ້ງ — ທ່ານສາມາດຕິດຕັ້ງໄດ້ທຸກເວລາ');
        }
        render();
      } catch (_) {
        state.deferredInstallPrompt = null;
        openInstallGuideModal();
      }
    }

    // --- Helpers ---
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      container.innerHTML = `
        <div class="animate-toast bg-hub-950 text-white px-4 py-2.5 rounded-full shadow-xl text-xs sm:text-sm font-medium flex items-center gap-2 border border-hub-700/70 whitespace-nowrap">
          <span class="w-2 h-2 rounded-full bg-accent-500"></span>
          <span>${escapeHTML(message)}</span>
        </div>
      `;
    }

    function openModal({ title, bodyHTML, primaryText = 'ຕົກລົງ', secondaryText = null, onPrimary = null }) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;

      box.innerHTML = `
        <div class="flex items-start justify-between gap-3 mb-3">
          <h3 class="text-lg font-bold text-hub-950">${escapeHTML(title)}</h3>
          <button id="modal-close-x" class="p-1.5 rounded-xl text-hub-700 hover:bg-hub-100 transition cursor-pointer" aria-label="ປິດ">✕</button>
        </div>
        <div class="text-sm text-hub-800 space-y-3 mb-6">${bodyHTML}</div>
        <div class="flex items-center justify-end gap-2.5">
          ${secondaryText ? `<button id="modal-secondary-btn" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-hub-800 bg-hub-100 hover:bg-hub-200 transition cursor-pointer">${escapeHTML(secondaryText)}</button>` : ''}
          <button id="modal-primary-btn" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-hub-600 hover:bg-hub-700 shadow-md transition cursor-pointer">${escapeHTML(primaryText)}</button>
        </div>
      `;

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');

      const closeModal = () => {
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      };

      document.getElementById('modal-close-x').onclick = closeModal;
      if (secondaryText) {
        document.getElementById('modal-secondary-btn').onclick = closeModal;
      }
      document.getElementById('modal-primary-btn').onclick = () => {
        if (typeof onPrimary === 'function') onPrimary();
        closeModal();
      };
      backdrop.onclick = (e) => {
        if (e.target === backdrop) closeModal();
      };
    }

    function computeEffectiveDesktop() {
      if (state.viewportMode === 'phone') return false;
      if (state.viewportMode === 'desktop') return true;
      return window.innerWidth >= 768;
    }

    function setViewportMode(mode) {
      state.viewportMode = mode;
      state.isDesktopEffective = computeEffectiveDesktop();
      // When switching to desktop, ensure a valid page is selected
      if (state.isDesktopEffective && !state.desktopSelectedPageId) {
        state.desktopSelectedPageId = state.activePageId || 'web-home';
      }
      render();
      const labels = {
        auto: 'ໂໝດ ອັດຕະໂນມັດ (ຕາມຂະໜາດໜ້າຈໍ)',
        phone: 'ໂໝດ ໂທລະສັບມືຖື (Mobile Menu Hub)',
        desktop: 'ໂໝດ ຄອມພິວເຕີ (Desktop Workspace)'
      };
      showToast(labels[mode] || mode);
    }

    function navigateToPage(pageId) {
      const { group, page } = findPageContext(pageId);
      state.activePageId = page.id;
      state.desktopSelectedPageId = page.id;
      state.expandedDesktopGroups[group.id] = true;
      render();
      showToast(`ເປີດໜ້າ "${group.title} › ${page.title}"`);
    }

    function backToMobileMenuHome() {
      state.activePageId = null;
      render();
    }

    // --- Filtered Menu Groups / Items for Search & Group Tabs ---
    function getFilteredMenuGroups() {
      const q = state.searchQuery.trim().toLowerCase();
      return MENU_GROUPS
        .filter((grp) => state.activeGroupId === 'all' || grp.id === state.activeGroupId)
        .map((grp) => {
          const matchingPages = grp.pages.filter((p) => {
            if (!q) return true;
            return (
              p.title.toLowerCase().includes(q) ||
              p.subtitle.toLowerCase().includes(q) ||
              p.summary.toLowerCase().includes(q) ||
              grp.title.toLowerCase().includes(q)
            );
          });
          return { ...grp, pages: matchingPages };
        })
        .filter((grp) => grp.pages.length > 0 || !q);
    }

                                         }"
                                       >
                                         <span class="flex items-center gap-2 truncate">
                                           <span>${pg.icon}</span>
                                           <span class="truncate">${escapeHTML(pg.title)}</span>
                                         </span>
                                         <span class="text-[10px] px-1.5 py-0.5 rounded-md shrink-0 ${
                                           isSelected ? 'bg-white/20 text-white' : 'bg-hub-100 text-hub-700'
                                         }">${escapeHTML(pg.badge)}</span>
                                       </button>
                                     `;
                                   })
                                   .join('')}
                               </div>`
                            : ''
                        }
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            <!-- Sidebar Footer Quick Group Switcher -->
            <div class="p-4 border-t border-hub-200/80 bg-hub-50/70 text-xs text-hub-600">
              <div class="font-semibold text-hub-800 mb-1">ທາງລັດ 3 ໝວດຫຼັກ</div>
              <div class="flex items-center gap-1.5">
                <button type="button" data-nav-page="web-home" class="nav-page-btn flex-1 py-1.5 rounded-lg bg-white border border-hub-200 hover:bg-hub-100 font-semibold text-hub-900 cursor-pointer">🌐 ເວັບໄຊ</button>
                <button type="button" data-nav-page="hr-jobs" class="nav-page-btn flex-1 py-1.5 rounded-lg bg-white border border-hub-200 hover:bg-hub-100 font-semibold text-hub-900 cursor-pointer">👥 HR</button>
                <button type="button" data-nav-page="store-products" class="nav-page-btn flex-1 py-1.5 rounded-lg bg-white border border-hub-200 hover:bg-hub-100 font-semibold text-hub-900 cursor-pointer">🏪 ຮ້ານ</button>
              </div>
            </div>
          </aside>

          <!-- Main Desktop Content Workspace (8 cols on md, 9 cols on xl) -->
          <main class="col-span-8 xl:col-span-9 p-6 lg:p-8 overflow-y-auto space-y-6">
            <!-- Install / App Shortcut Banner on Desktop -->
            <div class="bg-white rounded-3xl px-5 py-3.5 border border-hub-200/80 shadow-soft flex items-center justify-between gap-4 flex-wrap">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-hub-100 flex items-center justify-center text-xl shrink-0">📲</div>
                <div>
                  <div class="text-sm font-bold text-hub-950">
                    ${
                      state.isStandaloneApp
                        ? 'ຕິດຕັ້ງແລ້ວ (ໂໝດແອັບ) — ສູນລວມເມນູນຳທາງ'
                        : 'ຕິດຕັ້ງເປັນແອັບ ຫຼື ສ້າງທາງລັດໄວ້ເທິງໜ້າຈໍຄອມພິວເຕີ / ໂທລະສັບ'
                    }
                  </div>
                  <div class="text-xs text-hub-600">
                    ${
                      state.isStandaloneApp
                        ? 'ທ່ານກຳລັງເປີດໃຊ້ງານໃນຮູບແບບແອັບ Standalone ແບບເຕັມໜ້າຈໍ'
                        : 'ເປີດເຂົ້າເມນູເວັບໄຊ, ເມນູຈັດຫາພະນັກງານ ແລະ ເມນູຮ້ານ ໄດ້ທັນທີໂດຍບໍ່ຕ້ອງເປີດບຣາວເຊີຫຼາຍຂັ້ນຕອນ'
                    }
                  </div>
                </div>
              </div>
              ${
                state.isStandaloneApp
                  ? `<span class="text-xs font-bold px-3 py-1.5 rounded-xl bg-accent-100 text-accent-700 border border-accent-200">✓ ຕິດຕັ້ງແລ້ວ (ໂໝດແອັບ)</span>`
                  : `<button type="button" class="pwa-trigger-btn px-4 py-2 rounded-xl bg-hub-600 hover:bg-hub-700 text-white text-xs font-bold shadow-xs transition cursor-pointer">ຕິດຕັ້ງ / ສ້າງທາງລັດ</button>`
              }
            </div>

            <!-- Top Quick Menu Hub Strip Across All 3 Groups -->
            <div class="bg-white rounded-3xl p-3.5 border border-hub-200/75 shadow-soft">
              <div class="flex items-center justify-between gap-2 mb-2.5 px-1">
                <span class="text-xs font-bold text-hub-700">ເມນູນຳທາງດ່ວນ (ກົດເພື່ອປ່ຽນໜ້າ):</span>
                <span class="text-[11px] text-hub-500">ກຳລັງເປີດ: <strong class="text-hub-900">${escapeHTML(activeGroup.title)} › ${escapeHTML(activePage.title)}</strong></span>
              </div>
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                ${MENU_GROUPS.flatMap((g) => g.pages)
                  .map((pg) => {
                    const isCurrent = pg.id === activePage.id;
                    return `
                      <button
                        type="button"
                        data-nav-page="${escapeHTML(pg.id)}"
                        class="nav-page-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer border ${
                          isCurrent
                            ? 'bg-hub-950 text-white border-hub-950 shadow-2xs'
                            : 'bg-hub-50 text-hub-800 border-hub-200/80 hover:bg-hub-100'
                        }"
                      >
                        <span>${pg.icon}</span>
                        <span>${escapeHTML(pg.title)}</span>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </div>

            <!-- Active Sub-Page Content -->
            ${renderSubPageDetail(activePage, activeGroup, false)}
          </main>
        </div>
      `;
    }

    // --- Render & Event Binding ---
    function render() {
      state.isDesktopEffective = computeEffectiveDesktop();
      const root = document.getElementById('app');
      if (!root) return;

      const activeEl = document.activeElement;
      const isSearch = activeEl && (activeEl.id === 'mobile-hub-search' || activeEl.id === 'desktop-hub-search');
      const cursorPos = isSearch ? activeEl.selectionStart : null;
      const focusedId = isSearch ? activeEl.id : null;

      let bodyContent = '';
      if (state.isDesktopEffective) {
        bodyContent = renderDesktopUI();
      } else if (state.viewportMode === 'phone') {
        bodyContent = `
          <div class="forced-phone-wrapper">
            <div class="forced-phone-frame">
              ${renderMobilePhoneUI()}
            </div>
          </div>
        `;
      } else {
        bodyContent = renderMobilePhoneUI();
      }

      root.innerHTML = `
        ${renderViewportSwitcher()}
        ${bodyContent}
      `;

      bindEvents();

      if (focusedId) {
        const nextInput = document.getElementById(focusedId);
        if (nextInput) {
          nextInput.focus();
          if (cursorPos !== null) {
            try {
              nextInput.setSelectionRange(cursorPos, cursorPos);
            } catch (_) {}
          }
        }
      }
    }

    function bindEvents() {
      // PWA install / shortcut triggers
      document.querySelectorAll('.pwa-trigger-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.deferredInstallPrompt) {
            triggerNativeInstallPrompt();
          } else {
            openInstallGuideModal();
          }
        });
      });

      // Viewport mode buttons
      document.querySelectorAll('.vp-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          setViewportMode(btn.getAttribute('data-vp-mode'));
        });
      });

      // Navigate to sub-page buttons
      document.querySelectorAll('.nav-page-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-nav-page');
          if (targetId) navigateToPage(targetId);
        });
      });

      // Mobile back button
      const backBtn = document.getElementById('mobile-back-btn');
      if (backBtn) {
        backBtn.addEventListener('click', backToMobileMenuHome);
      }

      // Mobile group filter pills
      document.querySelectorAll('.group-filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.activeGroupId = btn.getAttribute('data-group-filter') || 'all';
          render();
        });
      });

      // Mobile bottom navigation
      document.querySelectorAll('.bottom-nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const navId = btn.getAttribute('data-bottom-nav');
          const targetPage = btn.getAttribute('data-target-page');
          if (navId === 'home') {
            backToMobileMenuHome();
          } else if (targetPage) {
            navigateToPage(targetPage);
          }
        });
      });

      // Desktop accordion group toggle
      document.querySelectorAll('.toggle-group-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const grpId = btn.getAttribute('data-toggle-group');
          if (grpId) {
            state.expandedDesktopGroups[grpId] = state.expandedDesktopGroups[grpId] === false ? true : false;
            render();
          }
        });
      });

      // Search inputs (mobile & desktop)
      const mobileSearch = document.getElementById('mobile-hub-search');
      if (mobileSearch) {
        mobileSearch.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          render();
        });
      }
      const desktopSearch = document.getElementById('desktop-hub-search');
      if (desktopSearch) {
        desktopSearch.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          render();
        });
      }

      // Clear search buttons
      const mClear = document.getElementById('mobile-hub-clear-search');
      if (mClear) {
        mClear.addEventListener('click', () => {
          state.searchQuery = '';
          render();
        });
      }
      const dClear = document.getElementById('desktop-hub-clear-search');
      if (dClear) {
        dClear.addEventListener('click', () => {
          state.searchQuery = '';
          render();
        });
      }

      // Reset search button
      const resetHubBtn = document.getElementById('mobile-reset-hub-btn');
      if (resetHubBtn) {
        resetHubBtn.addEventListener('click', () => {
          state.searchQuery = '';
          state.activeGroupId = 'all';
          render();
        });
      }

      // Contact message modal trigger
      const contactBtn = document.getElementById('open-contact-form-btn');
      if (contactBtn) {
        contactBtn.addEventListener('click', () => {
          openModal({
            title: 'ສົ່ງຂໍ້ຄວາມຫາທີມງານ',
            primaryText: 'ສົ່ງຂໍ້ຄວາມ',
            secondaryText: 'ຍົກເລີກ',
            bodyHTML: `
              <div class="space-y-2.5">
                <div>
                  <label class="block text-xs font-semibold text-hub-800 mb-1">ຊື່ ແລະ ນາມສະກຸນ</label>
                  <input id="msg-name" type="text" placeholder="ປ້ອນຊື່ຂອງທ່ານ..." class="w-full px-3 py-2 rounded-xl border border-hub-200 text-sm focus:outline-none focus:border-hub-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-hub-800 mb-1">ຫົວຂໍ້ / ລາຍລະອຽດ</label>
                  <textarea id="msg-body" rows="3" placeholder="ພິມຂໍ້ຄວາມທີ່ຕ້ອງການສອບຖາມ..." class="w-full px-3 py-2 rounded-xl border border-hub-200 text-sm focus:outline-none focus:border-hub-500"></textarea>
                </div>
              </div>
            `,
            onPrimary: () => {
              showToast('ສົ່ງຂໍ້ຄວາມຫາທີມງານສຳເລັດແລ້ວ');
            }
          });
        });
      }
    }

    // Listen to window resize for 'auto' responsive mode
    window.addEventListener('resize', () => {
      if (state.viewportMode === 'auto') {
        const nextDesktop = window.innerWidth >= 768;
        if (nextDesktop !== state.isDesktopEffective) {
          state.isDesktopEffective = nextDesktop;
          render();
        }
      }
    });

    // Capture native browser install prompt (Chrome / Edge / Android)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      state.deferredInstallPrompt = e;
      render();
    });

    // Detect completion when app is installed as a standalone app / shortcut
    window.addEventListener('appinstalled', () => {
      state.deferredInstallPrompt = null;
      state.installOutcome = 'accepted';
      detectStandaloneMode();
      render();
      showToast('ຕິດຕັ້ງແອັບ "ເມນູນຳທາງ" ສຳເລັດແລ້ວ!');
    });

    // React to display-mode changes (e.g., opening from home screen / shortcut)
    if (window.matchMedia) {
      const displayModeMq = window.matchMedia('(display-mode: standalone)');
      const onDisplayModeChange = () => {
        detectStandaloneMode();
        render();
      };
      if (typeof displayModeMq.addEventListener === 'function') {
        displayModeMq.addEventListener('change', onDisplayModeChange);
      } else if (typeof displayModeMq.addListener === 'function') {
        displayModeMq.addListener(onDisplayModeChange);
      }
    }

    // Initial render
    window.addEventListener('DOMContentLoaded', () => {
      detectStandaloneMode();
      setupDynamicPwaManifest();
      registerDynamicServiceWorker();
      render();
    });
  </script>
</body>
</html>
